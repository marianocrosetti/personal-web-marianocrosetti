<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariano Crosetti | Research Engineer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="/" class="logo">MARIANO CROSETTI</a>
    </header>

    <main>
        <section class="hero">
            <div class="hero-heading">
                <h1>MARIANO<br>CROSETTI</h1>
                <div class="divider"></div>
            </div>
            <div class="hero-image">
                <img src="assets/profile.jpg" alt="Mariano Crosetti">
            </div>
            <div class="hero-titles" data-titles></div>
            <div class="links" data-links></div>
        </section>

        <section id="contact" class="contact">
            <h2>Contact me</h2>
            <form id="contact-form" action="https://formspree.io/f/xwlewzev" method="POST">
                <input type="hidden" name="_subject" value="Nuevo mensaje desde marianocrosetti.com">
                <input type="text" name="_gotcha" class="gotcha" tabindex="-1" autocomplete="off">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name">
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Write your message</label>
                    <textarea id="message" name="message" placeholder="Hi Mariano, I would like to know more about XXX"></textarea>
                </div>
                <button type="submit" class="submit-btn">Send</button>
                <p id="form-status" class="form-status" role="status"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Created by Mariano Crosetti</p>
    </footer>

    <script src="/constants.js"></script>
    <script src="/site.js"></script>
    <script>
        const form = document.getElementById('contact-form');
        const status = document.getElementById('form-status');
        const submitBtn = form.querySelector('.submit-btn');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            submitBtn.disabled = true;
            status.textContent = '';
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                });
                if (response.ok) {
                    form.reset();
                    status.textContent = 'Thanks! Your message has been sent.';
                    status.classList.remove('error');
                } else {
                    const data = await response.json().catch(() => ({}));
                    status.textContent = (data.errors && data.errors.map(e => e.message).join(', '))
                        || 'Oops! Something went wrong. Please try again.';
                    status.classList.add('error');
                }
            } catch {
                status.textContent = 'Network error. Please try again.';
                status.classList.add('error');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
